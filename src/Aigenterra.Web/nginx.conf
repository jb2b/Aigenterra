worker_processes auto;
pid /tmp/nginx.pid;
# nginx error messages can embed the original request URI (including its query).
# Keep routine request failures in the sanitized access log only.
error_log /dev/stderr crit;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Do not record bodies, query strings, credentials or user-supplied headers.
    log_format transport '$remote_addr $request_method $status $body_bytes_sent $request_time';
    access_log /dev/stdout transport;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    upstream execution_api {
        zone execution_api 64k;
        server api:8080 resolve;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        # Api enforces the 1 MiB Codex/evidence limits. Leave room for the JSON
        # envelope on the generic observation endpoint (Kestrel also bounds requests).
        client_max_body_size 30m;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'Healthy';
        }

        location = /api { return 404; }
        location ^~ /api/ {
            proxy_pass http://execution_api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_intercept_errors off;
            proxy_next_upstream off;
            proxy_cache off;
            proxy_request_buffering off;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            add_header Cache-Control 'no-store' always;
        }

        location ~ /\. { return 404; }
        location = /index.html {
            add_header Cache-Control 'no-cache' always;
        }
        # Angular's production hashes contain eight base64url characters.
        location ~* '-[a-z0-9_-]{8}\.(js|css|woff2?|png|svg|webp)$' {
            try_files $uri =404;
            add_header Cache-Control 'public, max-age=31536000, immutable';
        }
        location ~* \.(js|css|map|json|txt|ico|svg|png|jpg|jpeg|gif|webp|woff2?|ttf|html)$ {
            try_files $uri =404;
            add_header Cache-Control 'no-cache' always;
        }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control 'no-cache' always;
        }
    }
}
